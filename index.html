<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestión de residentes</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #F4F3EF;
    color: #26251F;
    margin: 0;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .count { font-size: 13px; color: #6B6A62; margin: 2px 0 0; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid #D8D6CC;
    background: #fff;
    padding: 9px 14px;
    font-size: 14px;
    color: #26251F;
  }
  button:hover { background: #F0EFE9; }
  #add-btn {
    background: #26251F;
    color: #fff;
    border-color: #26251F;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #add-btn:hover { background: #3a392f; }
  .empty {
    text-align: center;
    padding: 40px 16px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #E4E2D8;
  }
  .empty p:first-child { font-weight: 600; margin: 0 0 4px; }
  .empty p:last-child { font-size: 13px; color: #6B6A62; margin: 0; }
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: #fff;
    border: 1px solid #E4E2D8;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-info { display: flex; gap: 12px; align-items: center; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #E9E6D8; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; color: #6B5E1E; flex-shrink: 0;
  }
  .name { font-weight: 600; font-size: 15px; margin: 0; }
  .sub { font-size: 13px; color: #6B6A62; margin: 2px 0 0; }
  .actions { display: flex; gap: 4px; }
  .actions button { padding: 6px 8px; }
  .meds { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .med-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    background: #EFEBDB; color: #6B5E1E;
  }
  .no-meds { font-size: 12px; color: #A6A499; margin: 8px 0 0; }
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 10;
    padding: 16px;
  }
  .modal {
    background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 420px;
  }
  .modal h2 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
  label { font-size: 13px; color: #6B6A62; display: block; margin-bottom: 4px; }
  input, textarea {
    width: 100%; margin-bottom: 12px; padding: 9px 10px; font: inherit; font-size: 14px;
    border-radius: 8px; border: 1px solid #D8D6CC; background: #fff;
  }
  textarea { resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #modal-save { background: #26251F; color: #fff; border-color: #26251F; }
  .status { font-size: 13px; color: #A65252; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Residentes</h1>
      <p class="count" id="count-label">Cargando...</p>
    </div>
    <button id="add-btn">+ Agregar residente</button>
  </header>

  <div class="empty" id="empty-state" style="display:none;">
    <p>Todavía no hay residentes cargados</p>
    <p>Agregá el primero para empezar.</p>
  </div>

  <div id="list"></div>
  <p class="status" id="status-msg"></p>
</div>

<div id="overlay">
  <div class="modal">
    <h2 id="modal-title">Nuevo residente</h2>
    <label>Nombre completo</label>
    <input id="f-name" type="text" placeholder="Ej: Rosa Fernández" />
    <label>Edad</label>
    <input id="f-age" type="number" placeholder="Ej: 82" />
    <label>Obra social</label>
    <input id="f-insurance" type="text" placeholder="Ej: PAMI" />
    <label>Medicación (una por línea, con horario)</label>
    <textarea id="f-meds" rows="3" placeholder="Ej: Losartán 50mg - 8:00"></textarea>
    <div class="modal-actions">
      <button id="modal-cancel">Cancelar</button>
      <button id="modal-save">Guardar</button>
    </div>
  </div>
</div>

<script>
  // --- Conexión a Supabase ---
  // Reemplazá estos dos valores por los tuyos si alguna vez cambiás de proyecto.
  const SUPABASE_URL = "https://qvadtpizmkqvbdhswddk.supabase.co";
  const SUPABASE_KEY = "sb_publishable__DOKHN1RP6UxfdLnraI2eg_K68l_uOB";
  const TABLE = "residentes";
  const API = SUPABASE_URL + "/rest/v1/" + TABLE;

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty-state");
  const countEl = document.getElementById("count-label");
  const overlay = document.getElementById("overlay");
  const statusEl = document.getElementById("status-msg");

  let residents = [];
  let editingId = null;

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  function initials(name) {
    const parts = name.trim().split(/\s+/);
    const i = parts[0] ? parts[0][0] : "";
    const j = parts.length > 1 ? parts[parts.length - 1][0] : "";
    return (i + j).toUpperCase();
  }

  function showError(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = "block";
  }

  async function load() {
    try {
      const res = await fetch(API + "?select=*&order=creado_en.desc", { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      residents = await res.json();
      statusEl.style.display = "none";
    } catch (e) {
      showError("No se pudo conectar con la base de datos. Revisá la URL y la clave.");
      residents = [];
    }
    render();
  }

  function render() {
    listEl.innerHTML = "";
    countEl.textContent = residents.length === 0
      ? "Sin residentes cargados"
      : residents.length + (residents.length === 1 ? " residente" : " residentes");
    emptyEl.style.display = residents.length === 0 ? "block" : "none";

    residents.forEach(function (r) {
      const card = document.createElement("div");
      card.className = "card";

      const meds = (r.medicacion || "").split("\n").filter(Boolean);
      const medsHtml = meds.length
        ? '<div class="meds">' + meds.map(function (m) {
            return '<span class="med-pill">' + esc(m) + "</span>";
          }).join("") + "</div>"
        : '<p class="no-meds">Sin medicación cargada</p>';

      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-info">' +
            '<div class="avatar">' + esc(initials(r.nombre)) + "</div>" +
            "<div>" +
              '<p class="name">' + esc(r.nombre) + "</p>" +
              '<p class="sub">' + (r.edad ? r.edad + " años" : "Edad sin especificar") +
                (r.obra_social ? " · " + esc(r.obra_social) : "") + "</p>" +
            "</div>" +
          "</div>" +
          '<div class="actions">' +
            '<button class="edit-btn" data-id="' + r.id + '">Editar</button>' +
            '<button class="del-btn" data-id="' + r.id + '">Eliminar</button>' +
          "</div>" +
        "</div>" + medsHtml;

      listEl.appendChild(card);
    });

    listEl.querySelectorAll(".edit-btn").forEach(function (b) {
      b.addEventListener("click", function () { openModal(this.dataset.id); });
    });
    listEl.querySelectorAll(".del-btn").forEach(function (b) {
      b.addEventListener("click", async function () {
        const id = this.dataset.id;
        try {
          await fetch(API + "?id=eq." + id, { method: "DELETE", headers });
          residents = residents.filter(function (r) { return r.id !== id; });
          render();
        } catch (e) {
          showError("No se pudo eliminar. Probá de nuevo.");
        }
      });
    });
  }

  function openModal(id) {
    editingId = id || null;
    document.getElementById("modal-title").textContent = id ? "Editar residente" : "Nuevo residente";
    const r = id ? residents.find(function (x) { return x.id === id; }) : null;
    document.getElementById("f-name").value = r ? r.nombre : "";
    document.getElementById("f-age").value = r ? (r.edad || "") : "";
    document.getElementById("f-insurance").value = r ? (r.obra_social || "") : "";
    document.getElementById("f-meds").value = r ? (r.medicacion || "") : "";
    overlay.style.display = "flex";
  }

  function closeModal() { overlay.style.display = "none"; }

  document.getElementById("add-btn").addEventListener("click", function () { openModal(null); });
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

  document.getElementById("modal-save").addEventListener("click", async function () {
    const name = document.getElementById("f-name").value.trim();
    if (!name) { document.getElementById("f-name").focus(); return; }

    const data = {
      nombre: name,
      edad: document.getElementById("f-age").value.trim() || null,
      obra_social: document.getElementById("f-insurance").value.trim() || null,
      medicacion: document.getElementById("f-meds").value.trim() || null
    };

    try {
      if (editingId) {
        await fetch(API + "?id=eq." + editingId, {
          method: "PATCH", headers, body: JSON.stringify(data)
        });
      } else {
        await fetch(API, { method: "POST", headers, body: JSON.stringify(data) });
      }
      closeModal();
      await load();
    } catch (e) {
      showError("No se pudo guardar. Probá de nuevo.");
    }
  });

  load();
</script>
</body>
</html>
